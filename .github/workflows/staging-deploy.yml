name: Staging Deploy

on:
  push:
    branches:
      - staging

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "16"
          check-latest: true
          cache: "npm"
      - name: Install Dependencies
        run: npm install
      - name: Build
        run: CI=false npm run build # Set CI=false to prevent treating warnings as errors
      - name: Upload build artifacts
        uses: actions/upload-artifact@v2
        with:
          name: build-output
          path: build
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Download Artifact
        uses: actions/download-artifact@v2
        with:
          name: build-output
          path: build
      - name: Deploy to firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting:staging --message \"${{ github.event.head_commit.message }}\"

        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: certify-4bf9a
          REACT_APP_SENTRY_ENV: staging
          REACT_APP_URL: https://api.certwise.app
